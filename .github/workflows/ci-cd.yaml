name: Android Release

on:
  push:
    branches: [ "main" ,"Dev","Test"]

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "12.x" 
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: 'stable'
      - name: Get dependencies
        run: flutter pub get
      - name: flutter run icons_launcher
        run: flutter pub run flutter_launcher_icons

  staging:
    runs-on: ubuntu-latest
    needs: [develop]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "12.x" 
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: 'stable'
      - name: Get dependencies
        run: flutter pub get
      - name: flutter run icons_launcher
        run: flutter pub run flutter_launcher_icons
     

  build:
    runs-on: ubuntu-latest
    needs: [staging]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "17.x" 
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: 'stable'
      - name: Get dependencies
        run: flutter pub get
      - name: flutter run icons_launcher
        run: flutter pub run flutter_launcher_icons
      - name: flutter build apk
        run: flutter build apk 
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
    
  Deploy: 
    runs-on: ubuntu-latest
    needs: [build]
    steps: 
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with: 
          distribution: 'zulu'
          java-version: "17.x"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: 'stable'
      - name: Get dependencies
        run: flutter pub get
